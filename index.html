<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>漢字書き取り帖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ------------------------------------------------------------------
   design tokens
   paper + sumi ink + hanko vermilion — grounded in the writing desk,
   not a generic warm palette.
------------------------------------------------------------------- */
:root {
  --paper: #efece3;
  --paper-raised: #fbf9f2;
  --ink: #22262b;
  --ink-soft: #66645c;
  --line: #ddd6c2;
  --vermilion: #d8420f;
  --vermilion-tint: #f4d9c8;
  --bamboo: #3f7a52;
  --bamboo-tint: #dbe8dc;

  --font-display: "Klee One", "Hiragino Mincho ProN", "YuMincho", "Yu Mincho", "Noto Serif JP", serif;
  --font-body: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", -apple-system, BlinkMacSystemFont, sans-serif;

  --radius: 10px;
  --shadow-paper: 0 1px 0 rgba(34,38,43,0.04), 0 6px 16px -10px rgba(34,38,43,0.25);
}

@media (prefers-color-scheme: dark) {
  :root {
    --paper: #1c1b18;
    --paper-raised: #262420;
    --ink: #ede8dc;
    --ink-soft: #b0aa9a;
    --line: #3a362e;
    --vermilion: #ff6b3d;
    --vermilion-tint: #40281d;
    --bamboo: #6fbf8b;
    --bamboo-tint: #24332a;
    --shadow-paper: 0 1px 0 rgba(0,0,0,0.3), 0 8px 20px -10px rgba(0,0,0,0.5);
  }
}
:root[data-theme="dark"] {
  --paper: #1c1b18;
  --paper-raised: #262420;
  --ink: #ede8dc;
  --ink-soft: #b0aa9a;
  --line: #3a362e;
  --vermilion: #ff6b3d;
  --vermilion-tint: #40281d;
  --bamboo: #6fbf8b;
  --bamboo-tint: #24332a;
  --shadow-paper: 0 1px 0 rgba(0,0,0,0.3), 0 8px 20px -10px rgba(0,0,0,0.5);
}
:root[data-theme="light"] {
  --paper: #efece3;
  --paper-raised: #fbf9f2;
  --ink: #22262b;
  --ink-soft: #66645c;
  --line: #ddd6c2;
  --vermilion: #d8420f;
  --vermilion-tint: #f4d9c8;
  --bamboo: #3f7a52;
  --bamboo-tint: #dbe8dc;
  --shadow-paper: 0 1px 0 rgba(34,38,43,0.04), 0 6px 16px -10px rgba(34,38,43,0.25);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
}

/* faint genkōyōshi (manuscript-grid) texture, not a decoration but the
   subject's own material */
body {
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 27px, var(--line) 27px, var(--line) 28px),
    repeating-linear-gradient(90deg, transparent, transparent 27px, var(--line) 27px, var(--line) 28px);
  background-size: 28px 28px;
  background-attachment: fixed;
  opacity: 1;
}

@media (prefers-reduced-motion: no-preference) {
  .answer-box { animation: rise-in 0.35s ease-out; }
  .level-card { transition: border-color .15s ease, transform .1s ease; }
  .level-card:active { transform: scale(0.98); }
}
@keyframes rise-in {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ---------------------------- header ------------------------------ */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 18px;
  background: color-mix(in srgb, var(--paper-raised) 92%, transparent);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 10;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}
.hanko {
  width: 30px;
  height: 30px;
  border-radius: 7px;
  background: var(--vermilion);
  color: #fff8f0;
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1rem;
  box-shadow: var(--shadow-paper);
  transform: rotate(-2deg);
}
.brand h1 {
  font-family: var(--font-display);
  font-size: 1.05rem;
  font-weight: 600;
  margin: 0;
  letter-spacing: .02em;
}
.header-nav { display: flex; gap: 6px; }
.nav-btn {
  border: none;
  background: transparent;
  color: var(--ink-soft);
  padding: 7px 12px;
  border-radius: 999px;
  cursor: pointer;
  font-size: 0.85rem;
  font-family: var(--font-body);
}
.nav-btn.active { background: var(--vermilion-tint); color: var(--vermilion); font-weight: 600; }
.nav-btn:focus-visible, button:focus-visible, input:focus-visible {
  outline: 2px solid var(--vermilion);
  outline-offset: 2px;
}

main {
  max-width: 520px;
  margin: 0 auto;
  padding: 22px 18px 64px;
}

.screen h2 {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.3rem;
  margin: 4px 0 16px;
  text-wrap: balance;
}
.screen h3 {
  font-family: var(--font-display);
  font-size: 1.05rem;
  margin: 24px 0 10px;
}

/* --------------------------- home screen --------------------------- */
.level-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin: 6px 0 4px;
}
.level-card {
  border: 1.5px solid var(--line);
  border-radius: var(--radius);
  padding: 13px 14px;
  background: var(--paper-raised);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 3px;
  user-select: none;
}
.level-card.selected {
  border-color: var(--vermilion);
  background: var(--vermilion-tint);
}
.level-card .level-name {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.05rem;
}
.level-card .level-count {
  font-size: 0.78rem;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}

.review-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 18px 2px;
  font-size: 0.95rem;
}
.review-toggle input { width: 18px; height: 18px; accent-color: var(--vermilion); }

.home-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 18px;
}

.primary-btn, .secondary-btn, .danger-btn {
  border: none;
  border-radius: var(--radius);
  padding: 15px 20px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  font-family: var(--font-body);
}
.primary-btn {
  background: var(--vermilion);
  color: #fff8f0;
  box-shadow: var(--shadow-paper);
}
.primary-btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
.secondary-btn { background: var(--paper-raised); color: var(--ink); border: 1.5px solid var(--line); }
.danger-btn { background: transparent; color: var(--vermilion); border: 1.5px solid var(--vermilion); }
.text-btn {
  background: none; border: none; color: var(--ink-soft); cursor: pointer;
  font-size: 0.9rem; padding: 6px 0; font-family: var(--font-body);
}
.hint-text { color: var(--ink-soft); font-size: 0.85rem; text-align: center; margin-top: 14px; }

/* --------------------------- quiz screen ---------------------------- */
.quiz-top {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
}
.progress-label { color: var(--ink-soft); font-size: 0.88rem; font-variant-numeric: tabular-nums; }

.question-card {
  background: var(--paper-raised);
  border-radius: var(--radius);
  padding: 18px;
  border: 1px solid var(--line);
  box-shadow: var(--shadow-paper);
  margin-bottom: 18px;
}
.level-tag {
  display: inline-block;
  background: var(--vermilion-tint);
  color: var(--vermilion);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: .04em;
  padding: 3px 10px;
  border-radius: 999px;
  margin: 0 0 12px;
  font-family: var(--font-body);
}
.sentence {
  font-family: var(--font-display);
  font-size: 1.28rem;
  line-height: 1.95;
  margin: 0 0 8px;
}
.sentence .target {
  color: var(--vermilion);
  font-weight: 700;
  text-decoration: underline;
  text-decoration-style: dotted;
  text-decoration-thickness: 1.5px;
}
.hint-line { color: var(--ink-soft); font-size: 0.83rem; margin: 0; }

.canvas-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; margin: 14px 0; }
.kanji-canvas {
  display: block;
  width: 90%;
  aspect-ratio: 1 / 1;
  border: 1.5px solid var(--line);
  border-radius: 8px;
  background: #fffdf7;
  touch-action: none;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,0.02);
}
.canvas-actions { display: flex; justify-content: center; gap: 18px; margin-bottom: 18px; }
.reveal-area { display: flex; justify-content: center; }
.answer-area { margin-top: 4px; }

.answer-box {
  background: var(--paper-raised);
  border: 1.5px solid var(--vermilion);
  border-radius: var(--radius);
  padding: 20px;
  text-align: center;
  margin-bottom: 18px;
}
.answer-word { font-family: var(--font-display); font-size: 2.6rem; font-weight: 600; margin: 0 0 4px; line-height: 1.1; }
.answer-reading { color: var(--vermilion); font-size: 1.05rem; margin: 0 0 10px; font-family: var(--font-body); }
.answer-meaning { color: var(--ink-soft); font-size: 0.9rem; margin: 0; }

.grade-prompt { text-align: center; color: var(--ink-soft); margin: 0 0 10px; font-size: 0.92rem; }
.grade-buttons { display: flex; gap: 12px; }
.grade-btn {
  flex: 1; padding: 16px; border-radius: var(--radius); border: none;
  font-size: 1rem; font-weight: 700; cursor: pointer; font-family: var(--font-body);
}
.grade-btn.correct { background: var(--bamboo); color: #fff; }
.grade-btn.wrong { background: var(--vermilion); color: #fff8f0; }

/* ------------------------- session end ------------------------------ */
.session-summary {
  background: var(--paper-raised);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
  display: flex;
  justify-content: space-around;
  text-align: center;
  margin: 16px 0;
}
.session-summary .stat-value { font-family: var(--font-display); font-size: 1.9rem; font-weight: 600; display: block; font-variant-numeric: tabular-nums; }
.session-summary .stat-label { color: var(--ink-soft); font-size: 0.78rem; }

/* --------------------------- stats screen ---------------------------- */
.stats-overview { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 6px 0 4px; }
.stats-overview .stat-box { background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius); padding: 15px 8px; text-align: center; }
.stats-overview .stat-box .stat-value { font-family: var(--font-display); font-size: 1.55rem; font-weight: 600; display: block; font-variant-numeric: tabular-nums; }
.stats-overview .stat-box .stat-label { color: var(--ink-soft); font-size: 0.72rem; }

.weak-list { list-style: none; padding: 0; margin: 0 0 22px; display: flex; flex-direction: column; gap: 8px; }
.weak-list li {
  background: var(--paper-raised); border: 1px solid var(--line); border-radius: 10px;
  padding: 11px 14px; display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem;
}
.weak-list .weak-word { font-family: var(--font-display); font-weight: 600; }
.weak-list .weak-reading { color: var(--ink-soft); font-size: 0.85rem; margin-left: 6px; }
.weak-list .weak-score { color: var(--vermilion); font-size: 0.8rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
.empty-note { color: var(--ink-soft); font-size: 0.9rem; text-align: center; padding: 20px 0; }

footer.app-footer {
  max-width: 520px; margin: 0 auto; padding: 8px 18px 40px;
  color: var(--ink-soft); font-size: 0.72rem; text-align: center; line-height: 1.7;
}
footer.app-footer a { color: var(--ink-soft); text-decoration: underline; text-decoration-style: dotted; }
</style>
</head>
<body>
<header class="app-header">
  <div class="brand">
    <span class="hanko" aria-hidden="true">書</span>
    <h1>漢字書き取り帖</h1>
  </div>
  <nav class="header-nav">
    <button id="nav-home" class="nav-btn active" type="button">ホーム</button>
    <button id="nav-stats" class="nav-btn" type="button">学習記録</button>
  </nav>
</header>

<main id="app"></main>
<footer class="app-footer">級の判定は目安です。過去問集で確認しながらご利用ください。<br>筆順データ: <a href="https://kanjivg.tagaini.net/" target="_blank" rel="noopener">KanjiVG</a> (CC BY-SA 3.0)</footer>

<template id="tpl-home">
  <section class="screen" id="screen-home">
    <h2>級を選んでスタート</h2>
    <div class="level-grid" id="level-grid"></div>

    <label class="review-toggle">
      <input type="checkbox" id="review-only-checkbox">
      苦手な漢字だけ復習する
    </label>

    <div class="home-actions">
      <button id="start-btn" class="primary-btn" type="button">この条件で開始</button>
    </div>

    <p class="hint-text" id="selection-summary"></p>
  </section>
</template>

<template id="tpl-quiz">
  <section class="screen" id="screen-quiz">
    <div class="quiz-top">
      <button id="quit-btn" class="text-btn" type="button">← 中断してホームへ</button>
      <span class="progress-label" id="progress-label"></span>
    </div>

    <div class="question-card">
      <p class="level-tag" id="question-level-tag"></p>
      <p class="sentence" id="question-sentence"></p>
      <p class="hint-line">次の読みの部分を漢字で書きましょう</p>
    </div>

    <div class="canvas-wrap" id="canvas-wrap"></div>

    <div class="canvas-actions">
      <button id="play-demo-btn" class="text-btn" type="button" hidden>▶ お手本を見る</button>
      <button id="clear-btn" class="text-btn" type="button">🧹 消す</button>
    </div>

    <div class="answer-area" id="answer-area" hidden>
      <div class="answer-box">
        <p class="answer-word" id="answer-word"></p>
        <p class="answer-reading" id="answer-reading"></p>
        <p class="answer-meaning" id="answer-meaning"></p>
      </div>
      <div class="grade-actions">
        <p class="grade-prompt">正しく書けましたか？</p>
        <div class="grade-buttons">
          <button id="grade-wrong" class="grade-btn wrong" type="button">✕ できなかった</button>
          <button id="grade-correct" class="grade-btn correct" type="button">○ できた</button>
        </div>
      </div>
    </div>

    <div class="reveal-area" id="reveal-area">
      <button id="reveal-btn" class="primary-btn" type="button">答えを見る</button>
    </div>
  </section>
</template>

<template id="tpl-session-end">
  <section class="screen" id="screen-session-end">
    <h2>お疲れさまでした！</h2>
    <div class="session-summary" id="session-summary"></div>
    <div class="home-actions">
      <button id="review-wrong-btn" class="primary-btn" type="button">間違えた漢字を復習する</button>
      <button id="back-home-btn" class="secondary-btn" type="button">ホームへ戻る</button>
    </div>
  </section>
</template>

<template id="tpl-stats">
  <section class="screen" id="screen-stats">
    <h2>学習記録</h2>
    <div class="stats-overview" id="stats-overview"></div>
    <h3>苦手な漢字</h3>
    <ul class="weak-list" id="weak-list"></ul>
    <div class="home-actions">
      <button id="reset-progress-btn" class="danger-btn" type="button">記録をリセット</button>
    </div>
  </section>
</template>

<script>
// ------------------------------------------------------------------
// 漢字書き取りアプリ - メインロジック
// ------------------------------------------------------------------
const STORAGE_PROGRESS_KEY = "kanjiDictationProgress_v1";
const STORAGE_SETTINGS_KEY = "kanjiDictationSettings_v1";
const MAX_SESSION_LENGTH = 20;

const appEl = document.getElementById("app");

function loadProgress() {
  try { return JSON.parse(localStorage.getItem(STORAGE_PROGRESS_KEY)) || {}; }
  catch (e) { return {}; }
}
function saveProgress(progress) {
  localStorage.setItem(STORAGE_PROGRESS_KEY, JSON.stringify(progress));
}
function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_SETTINGS_KEY));
    if (s && Array.isArray(s.levels)) return s;
  } catch (e) { /* ignore */ }
  return { levels: KANJI_LEVELS.map(l => l.id), reviewOnly: false };
}
function saveSettings(settings) {
  localStorage.setItem(STORAGE_SETTINGS_KEY, JSON.stringify(settings));
}
function getItemProgress(progress, id) {
  return progress[id] || { box: 0, correct: 0, wrong: 0, lastResult: null, lastSeen: 0 };
}

let progress = loadProgress();
let settings = loadSettings();

const state = {
  screen: "home",
  queue: [],
  currentIndex: 0,
  revealed: false,
  sessionStats: { correct: 0, wrong: 0 },
};

function setScreen(name) {
  state.screen = name;
  document.getElementById("nav-home").classList.toggle("active", name === "home");
  document.getElementById("nav-stats").classList.toggle("active", name === "stats");
  render();
}
document.getElementById("nav-home").addEventListener("click", () => setScreen("home"));
document.getElementById("nav-stats").addEventListener("click", () => setScreen("stats"));

function render() {
  appEl.innerHTML = "";
  if (state.screen === "home") renderHome();
  else if (state.screen === "quiz") renderQuiz();
  else if (state.screen === "sessionEnd") renderSessionEnd();
  else if (state.screen === "stats") renderStats();
}

function levelWordCount(levelId) {
  return KANJI_DATA.filter(w => w.level === levelId).length;
}

function renderHome() {
  appEl.innerHTML = "";
  const tpl = document.getElementById("tpl-home");
  appEl.appendChild(tpl.content.cloneNode(true));

  const grid = document.getElementById("level-grid");
  KANJI_LEVELS.forEach(level => {
    const card = document.createElement("div");
    card.className = "level-card" + (settings.levels.includes(level.id) ? " selected" : "");
    card.innerHTML = `
      <span class="level-name">${level.label}</span>
      <span class="level-count">${levelWordCount(level.id)}問</span>
    `;
    card.addEventListener("click", () => {
      const idx = settings.levels.indexOf(level.id);
      if (idx >= 0) settings.levels.splice(idx, 1);
      else settings.levels.push(level.id);
      saveSettings(settings);
      renderHome();
    });
    grid.appendChild(card);
  });

  const reviewCheckbox = document.getElementById("review-only-checkbox");
  reviewCheckbox.checked = settings.reviewOnly;
  reviewCheckbox.addEventListener("change", () => {
    settings.reviewOnly = reviewCheckbox.checked;
    saveSettings(settings);
    renderHome();
  });

  const filtered = getFilteredWords();
  const summary = document.getElementById("selection-summary");
  const startBtn = document.getElementById("start-btn");

  if (settings.levels.length === 0) {
    summary.textContent = "級を1つ以上選んでください。";
    startBtn.disabled = true;
  } else if (filtered.length === 0) {
    summary.textContent = settings.reviewOnly
      ? "選んだ級の中に、まだ苦手な漢字はありません。"
      : "この条件に合う問題がありません。";
    startBtn.disabled = true;
  } else {
    summary.textContent = `${filtered.length}問の中から出題します。`;
    startBtn.disabled = false;
  }
  startBtn.addEventListener("click", startSession);
}

function getFilteredWords() {
  let words = KANJI_DATA.filter(w => settings.levels.includes(w.level));
  if (settings.reviewOnly) {
    words = words.filter(w => getItemProgress(progress, w.id).wrong > 0);
  }
  return words;
}

function buildQueue(words) {
  const weighted = words.map(w => {
    const box = getItemProgress(progress, w.id).box;
    const weight = Math.max(0.5, 6 - box);
    const key = Math.pow(Math.random(), 1 / weight);
    return { word: w, key };
  });
  weighted.sort((a, b) => b.key - a.key);
  const limit = settings.reviewOnly ? weighted.length : Math.min(weighted.length, MAX_SESSION_LENGTH);
  return weighted.slice(0, limit).map(x => x.word);
}

function startSession() {
  const filtered = getFilteredWords();
  if (filtered.length === 0) return;
  state.queue = buildQueue(filtered);
  state.currentIndex = 0;
  state.revealed = false;
  state.sessionStats = { correct: 0, wrong: 0 };
  setScreen("quiz");
}

const LEVEL_LABELS = Object.fromEntries(KANJI_LEVELS.map(l => [l.id, l.label]));
let canvasContexts = [];

function renderQuiz() {
  appEl.innerHTML = "";
  const tpl = document.getElementById("tpl-quiz");
  appEl.appendChild(tpl.content.cloneNode(true));

  const question = state.queue[state.currentIndex];

  document.getElementById("quit-btn").addEventListener("click", () => setScreen("home"));
  document.getElementById("progress-label").textContent = `${state.currentIndex + 1} / ${state.queue.length}`;
  document.getElementById("question-level-tag").textContent = LEVEL_LABELS[question.level];

  const sentenceHtml = question.sentence.replace(
    question.reading,
    `<span class="target">${question.reading}</span>`
  );
  document.getElementById("question-sentence").innerHTML = sentenceHtml;

  setupCanvases(Array.from(question.word).length);
  document.getElementById("clear-btn").addEventListener("click", clearAllCanvases);
  document.getElementById("reveal-btn").addEventListener("click", () => {
    state.revealed = true;
    showAnswer(question);
  });
  document.getElementById("grade-correct").addEventListener("click", () => gradeAnswer(question, true));
  document.getElementById("grade-wrong").addEventListener("click", () => gradeAnswer(question, false));

  if (state.revealed) showAnswer(question);
}

const SVG_NS = "http://www.w3.org/2000/svg";
const STROKE_PENDING_COLOR = "#cabfa2";
const STROKE_CURRENT_COLOR = "#d8420f";
const STROKE_DONE_COLOR = "#22262b";

function setupCanvases(charCount, guideChars) {
  const wrap = document.getElementById("canvas-wrap");
  wrap.innerHTML = "";
  canvasContexts = [];
  // Fixed intrinsic resolution; CSS (width:90%, aspect-ratio:1/1) stretches
  // each canvas to (most of) the screen width as a square. pos() below
  // already scales pointer coordinates by canvas.width/rect.width, so this
  // stays accurate at any displayed size.
  const RES = 400;

  for (let i = 0; i < charCount; i++) {
    const guideChar = guideChars ? guideChars[i] : null;
    const kanjiVgData = guideChar ? KANJI_STROKES[guideChar] : null;

    if (kanjiVgData && kanjiVgData.d && kanjiVgData.d.length) {
      canvasContexts.push(setupStrokeBox(wrap, guideChar, kanjiVgData.d, kanjiVgData.n));
    } else {
      canvasContexts.push(setupFreehandBox(wrap, RES, guideChar));
    }
  }
}

// ---------------------------------------------------------------------
// Freehand box: plain drawing (normal writing) or, for a guide character
// with no KanjiVG stroke data (e.g. okurigana kana), the old "scratch card"
// whole-glyph reveal.
// ---------------------------------------------------------------------
function setupFreehandBox(wrap, RES, guideChar) {
  const canvas = document.createElement("canvas");
  canvas.className = "kanji-canvas";
  canvas.width = RES;
  canvas.height = RES;
  wrap.appendChild(canvas);

  const ctx = canvas.getContext("2d");
  drawGuide(ctx, RES, RES, guideChar);

  const entry = { mode: "freehand", canvas, ctx, drawing: false, lastX: 0, lastY: 0, guideChar };

  if (guideChar) {
    const darkGlyphCanvas = document.createElement("canvas");
    darkGlyphCanvas.width = RES;
    darkGlyphCanvas.height = RES;
    const dctx = darkGlyphCanvas.getContext("2d");
    dctx.fillStyle = "#22262b";
    dctx.font = `600 ${Math.floor(RES * 0.72)}px "Klee One", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif`;
    dctx.textAlign = "center";
    dctx.textBaseline = "middle";
    dctx.fillText(guideChar, RES / 2, RES / 2 + RES * 0.03);

    const traceMaskCanvas = document.createElement("canvas");
    traceMaskCanvas.width = RES;
    traceMaskCanvas.height = RES;

    const tempCanvas = document.createElement("canvas");
    tempCanvas.width = RES;
    tempCanvas.height = RES;

    entry.darkGlyphCanvas = darkGlyphCanvas;
    entry.traceMaskCanvas = traceMaskCanvas;
    entry.traceMaskCtx = traceMaskCanvas.getContext("2d");
    entry.tempCanvas = tempCanvas;
    entry.tempCtx = tempCanvas.getContext("2d");

    if (document.fonts && document.fonts.load) {
      const fontSpec = `600 ${Math.floor(RES * 0.72)}px "Klee One"`;
      document.fonts.load(fontSpec, guideChar).then(() => {
        drawGuide(entry.ctx, RES, RES, guideChar);
        dctx.clearRect(0, 0, RES, RES);
        dctx.fillStyle = "#22262b";
        dctx.font = `600 ${Math.floor(RES * 0.72)}px "Klee One", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif`;
        dctx.textAlign = "center";
        dctx.textBaseline = "middle";
        dctx.fillText(guideChar, RES / 2, RES / 2 + RES * 0.03);
      }).catch(() => {});
    }
  }

  attachDrawingHandlers(entry);
  return entry;
}

function revealTraceAt(entry, x1, y1, x2, y2) {
  const RES = entry.canvas.width;
  const tctx = entry.traceMaskCtx;
  tctx.strokeStyle = "#000";
  tctx.fillStyle = "#000";
  tctx.lineCap = "round";
  tctx.lineJoin = "round";
  tctx.lineWidth = 50;
  tctx.beginPath();
  tctx.moveTo(x1, y1);
  tctx.lineTo(x2, y2);
  tctx.stroke();
  tctx.beginPath();
  tctx.arc(x2, y2, 25, 0, Math.PI * 2);
  tctx.fill();

  const tc = entry.tempCtx;
  tc.clearRect(0, 0, RES, RES);
  tc.globalCompositeOperation = "source-over";
  tc.drawImage(entry.darkGlyphCanvas, 0, 0);
  tc.globalCompositeOperation = "destination-in";
  tc.drawImage(entry.traceMaskCanvas, 0, 0);
  tc.globalCompositeOperation = "source-over";

  entry.ctx.drawImage(entry.tempCanvas, 0, 0);
}

// ---------------------------------------------------------------------
// Stroke-order box: real KanjiVG stroke paths. The next stroke to write is
// highlighted; touching/dragging across it completes that whole stroke and
// advances to the next one. Order is enforced — only the highlighted
// stroke responds.
// ---------------------------------------------------------------------
const STROKE_NUMBER_COLOR = "#a89a7c";

function setupStrokeBox(wrap, char, strokePaths, numberPositions) {
  const svg = document.createElementNS(SVG_NS, "svg");
  svg.setAttribute("class", "kanji-canvas");
  svg.setAttribute("viewBox", "0 0 109 109");

  const guideLine1 = document.createElementNS(SVG_NS, "line");
  guideLine1.setAttribute("x1", "54.5"); guideLine1.setAttribute("y1", "0");
  guideLine1.setAttribute("x2", "54.5"); guideLine1.setAttribute("y2", "109");
  guideLine1.setAttribute("stroke", "#ddd3bd");
  guideLine1.setAttribute("stroke-width", "0.6");
  guideLine1.setAttribute("stroke-dasharray", "2,2");
  svg.appendChild(guideLine1);

  const guideLine2 = document.createElementNS(SVG_NS, "line");
  guideLine2.setAttribute("x1", "0"); guideLine2.setAttribute("y1", "54.5");
  guideLine2.setAttribute("x2", "109"); guideLine2.setAttribute("y2", "54.5");
  guideLine2.setAttribute("stroke", "#ddd3bd");
  guideLine2.setAttribute("stroke-width", "0.6");
  guideLine2.setAttribute("stroke-dasharray", "2,2");
  svg.appendChild(guideLine2);

  const strokeEls = strokePaths.map((d) => {
    const p = document.createElementNS(SVG_NS, "path");
    p.setAttribute("d", d);
    p.setAttribute("fill", "none");
    p.setAttribute("stroke-width", "7");
    p.setAttribute("stroke-linecap", "round");
    p.setAttribute("stroke-linejoin", "round");
    svg.appendChild(p);
    return p;
  });

  if (numberPositions) {
    strokePaths.forEach((_, idx) => {
      const pos = numberPositions[idx];
      if (!pos) return;
      const t = document.createElementNS(SVG_NS, "text");
      t.setAttribute("x", pos[0]);
      t.setAttribute("y", pos[1]);
      t.setAttribute("font-size", "7.5");
      t.setAttribute("fill", STROKE_NUMBER_COLOR);
      t.setAttribute("font-family", "sans-serif");
      t.textContent = String(idx + 1);
      svg.appendChild(t);
    });
  }

  wrap.appendChild(svg);

  const entry = { mode: "stroke", svg, strokeEls, currentStrokeIndex: 0, guideChar: char, playingDemo: false };
  paintStrokeColors(entry);
  attachStrokeHandlers(entry);
  return entry;
}

function paintStrokeColors(entry) {
  entry.strokeEls.forEach((el, idx) => {
    if (idx < entry.currentStrokeIndex) el.setAttribute("stroke", STROKE_DONE_COLOR);
    else if (idx === entry.currentStrokeIndex) el.setAttribute("stroke", STROKE_CURRENT_COLOR);
    else el.setAttribute("stroke", STROKE_PENDING_COLOR);
  });
}

// Animates each stroke drawing itself in order, using the classic
// stroke-dasharray/dashoffset "line draw" technique, then restores whatever
// the learner's actual trace progress was.
function playStrokeDemo(entry) {
  if (entry.mode !== "stroke" || entry.playingDemo) return;
  entry.playingDemo = true;
  const els = entry.strokeEls;
  const STROKE_MS = 420;
  const GAP_MS = 160;

  els.forEach((el) => {
    const len = el.getTotalLength();
    el.style.transition = "none";
    el.setAttribute("stroke", STROKE_DONE_COLOR);
    el.style.strokeDasharray = String(len);
    el.style.strokeDashoffset = String(len);
  });

  let i = 0;
  function step() {
    if (i >= els.length) {
      els.forEach((el) => {
        el.style.transition = "";
        el.style.strokeDasharray = "";
        el.style.strokeDashoffset = "";
      });
      paintStrokeColors(entry);
      entry.playingDemo = false;
      return;
    }
    const el = els[i];
    void el.getBoundingClientRect();
    el.style.transition = `stroke-dashoffset ${STROKE_MS}ms linear`;
    el.style.strokeDashoffset = "0";
    i += 1;
    setTimeout(step, STROKE_MS + GAP_MS);
  }
  step();
}

function getStrokeSamples(el) {
  if (!el.__samples) {
    const len = el.getTotalLength();
    const SAMPLE_COUNT = 28;
    const pts = [];
    for (let i = 0; i <= SAMPLE_COUNT; i++) {
      pts.push(el.getPointAtLength((i / SAMPLE_COUNT) * len));
    }
    el.__samples = pts;
  }
  return el.__samples;
}

function attachStrokeHandlers(entry) {
  const { svg } = entry;
  let active = false;
  let lastP = null;
  // A stroke only completes once the finger has actually travelled along
  // most of its length — not merely touched two points on it, and not
  // merely crossed through it while tracing a different, intersecting
  // stroke. Coverage is tracked against sample points spread along the
  // real KanjiVG path. Fast drags can skip from one pointermove event to
  // the next with real physical distance between them, so each move is
  // walked in short interpolated steps rather than testing only its
  // endpoint — otherwise a quick straight-line cut across a hooked or
  // curved stroke could rack up coverage it never actually followed.
  const COVER_RADIUS = 6; // close to the stroke's own visual width
  const COVERAGE_THRESHOLD = 0.8;
  const STEP_SIZE = 3; // interpolation step, in the 109-unit viewBox

  function toSvgPoint(e) {
    const ctm = svg.getScreenCTM();
    if (!ctm) return null;
    const pt = svg.createSVGPoint();
    pt.x = e.clientX;
    pt.y = e.clientY;
    return pt.matrixTransform(ctm.inverse());
  }

  function markCoverage(samples, point) {
    let touchedNewSample = false;
    for (let i = 0; i < samples.length; i++) {
      if (entry.coveredMask[i]) continue;
      const dx = point.x - samples[i].x, dy = point.y - samples[i].y;
      if (Math.sqrt(dx * dx + dy * dy) <= COVER_RADIUS) {
        entry.coveredMask[i] = true;
        touchedNewSample = true;
      }
    }
    return touchedNewSample;
  }

  function processPoint(p) {
    if (entry.playingDemo) return;
    if (entry.currentStrokeIndex >= entry.strokeEls.length) return;
    const currentEl = entry.strokeEls[entry.currentStrokeIndex];
    const samples = getStrokeSamples(currentEl);
    if (!entry.coveredMask || entry.coveredMask.length !== samples.length) {
      entry.coveredMask = new Array(samples.length).fill(false);
    }
    if (!markCoverage(samples, p)) return;
    const coveredCount = entry.coveredMask.filter(Boolean).length;
    if (coveredCount / samples.length >= COVERAGE_THRESHOLD) {
      entry.currentStrokeIndex += 1;
      entry.coveredMask = null;
      paintStrokeColors(entry);
    }
  }

  svg.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    svg.setPointerCapture(e.pointerId);
    active = true;
    lastP = toSvgPoint(e);
    if (lastP) processPoint(lastP);
  });
  svg.addEventListener("pointermove", (e) => {
    if (!active) return;
    e.preventDefault();
    const p = toSvgPoint(e);
    if (!p) return;
    if (lastP) {
      const dx = p.x - lastP.x, dy = p.y - lastP.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const steps = Math.min(40, Math.ceil(dist / STEP_SIZE));
      for (let s = 1; s <= steps; s++) {
        const t = s / steps;
        processPoint({ x: lastP.x + dx * t, y: lastP.y + dy * t });
      }
    } else {
      processPoint(p);
    }
    lastP = p;
  });
  function stop() { active = false; lastP = null; }
  svg.addEventListener("pointerup", stop);
  svg.addEventListener("pointercancel", stop);
  svg.addEventListener("pointerleave", stop);
}

function drawGuide(ctx, w, h, guideChar) {
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = "#fffdf7";
  ctx.fillRect(0, 0, w, h);
  ctx.save();
  ctx.strokeStyle = "#ddd3bd";
  ctx.setLineDash([4, 4]);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(w / 2, 0);
  ctx.lineTo(w / 2, h);
  ctx.moveTo(0, h / 2);
  ctx.lineTo(w, h / 2);
  ctx.stroke();
  ctx.restore();
  if (guideChar) {
    ctx.save();
    ctx.fillStyle = "#cabfa2";
    ctx.font = `600 ${Math.floor(h * 0.72)}px "Klee One", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(guideChar, w / 2, h / 2 + h * 0.03);
    ctx.restore();
  }
}

function attachDrawingHandlers(entry) {
  const { canvas, ctx } = entry;
  function pos(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) * (canvas.width / rect.width),
      y: (e.clientY - rect.top) * (canvas.height / rect.height),
    };
  }
  canvas.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    entry.drawing = true;
    const p = pos(e);
    entry.lastX = p.x; entry.lastY = p.y;
    if (entry.guideChar) {
      revealTraceAt(entry, p.x, p.y, p.x, p.y);
    } else {
      ctx.beginPath();
      ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
      ctx.fillStyle = "#22262b";
      ctx.fill();
    }
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!entry.drawing) return;
    e.preventDefault();
    const p = pos(e);
    if (entry.guideChar) {
      revealTraceAt(entry, entry.lastX, entry.lastY, p.x, p.y);
    } else {
      ctx.strokeStyle = "#22262b";
      ctx.lineWidth = 12;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.beginPath();
      ctx.moveTo(entry.lastX, entry.lastY);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }
    entry.lastX = p.x; entry.lastY = p.y;
  });
  function stop() { entry.drawing = false; }
  canvas.addEventListener("pointerup", stop);
  canvas.addEventListener("pointercancel", stop);
  canvas.addEventListener("pointerleave", stop);
}

function clearAllCanvases() {
  canvasContexts.forEach(entry => {
    if (entry.mode === "stroke") {
      entry.playingDemo = false;
      entry.currentStrokeIndex = 0;
      entry.coveredMask = null;
      entry.strokeEls.forEach((el) => {
        el.style.transition = "";
        el.style.strokeDasharray = "";
        el.style.strokeDashoffset = "";
      });
      paintStrokeColors(entry);
    } else {
      drawGuide(entry.ctx, entry.canvas.width, entry.canvas.height, entry.guideChar);
      if (entry.traceMaskCtx) {
        entry.traceMaskCtx.clearRect(0, 0, entry.traceMaskCanvas.width, entry.traceMaskCanvas.height);
      }
    }
  });
}

function showAnswer(question) {
  document.getElementById("reveal-area").hidden = true;
  const answerArea = document.getElementById("answer-area");
  answerArea.hidden = false;
  document.getElementById("answer-word").textContent = question.word;
  document.getElementById("answer-reading").textContent = question.reading;
  document.getElementById("answer-meaning").textContent = question.meaning || "";
}

function gradeAnswer(question, isCorrect) {
  const item = getItemProgress(progress, question.id);
  if (isCorrect) {
    item.box = Math.min(5, item.box + 1);
    item.correct += 1;
    item.lastResult = "correct";
    state.sessionStats.correct += 1;
  } else {
    item.box = 0;
    item.wrong += 1;
    item.lastResult = "wrong";
    state.sessionStats.wrong += 1;
  }
  item.lastSeen = Date.now();
  progress[question.id] = item;
  saveProgress(progress);

  showTracePractice(question);
}

function advanceQuestion() {
  state.revealed = false;
  if (state.currentIndex + 1 < state.queue.length) {
    state.currentIndex += 1;
    renderQuiz();
    appEl.scrollIntoView({ block: "start" });
  } else {
    setScreen("sessionEnd");
  }
}

function showTracePractice(question) {
  const chars = Array.from(question.word);
  setupCanvases(chars.length, chars);

  const gradeActions = document.querySelector(".grade-actions");
  if (gradeActions) {
    gradeActions.innerHTML = `
      <p class="grade-prompt">お手本をなぞって、正しい形を覚えましょう</p>
      <button id="trace-next-btn" class="primary-btn" type="button">次へ</button>
    `;
    document.getElementById("trace-next-btn").addEventListener("click", advanceQuestion);
  }

  const clearBtn = document.getElementById("clear-btn");
  if (clearBtn) clearBtn.textContent = "🧹 消してもう一度なぞる";

  const playBtn = document.getElementById("play-demo-btn");
  if (playBtn) {
    const hasStrokeData = canvasContexts.some((e) => e.mode === "stroke");
    playBtn.hidden = !hasStrokeData;
    playBtn.addEventListener("click", () => {
      canvasContexts.forEach((e) => { if (e.mode === "stroke") playStrokeDemo(e); });
    });
  }

  appEl.scrollIntoView({ block: "start" });
}

function renderSessionEnd() {
  appEl.innerHTML = "";
  const tpl = document.getElementById("tpl-session-end");
  appEl.appendChild(tpl.content.cloneNode(true));

  const { correct, wrong } = state.sessionStats;
  document.getElementById("session-summary").innerHTML = `
    <div><span class="stat-value">${correct}</span><span class="stat-label">できた</span></div>
    <div><span class="stat-value">${wrong}</span><span class="stat-label">できなかった</span></div>
    <div><span class="stat-value">${correct + wrong}</span><span class="stat-label">合計</span></div>
  `;

  const reviewBtn = document.getElementById("review-wrong-btn");
  if (wrong === 0) {
    reviewBtn.remove();
  } else {
    reviewBtn.addEventListener("click", () => {
      settings.reviewOnly = true;
      saveSettings(settings);
      const words = getFilteredWords();
      if (words.length === 0) { setScreen("home"); return; }
      state.queue = buildQueue(words);
      state.currentIndex = 0;
      state.revealed = false;
      state.sessionStats = { correct: 0, wrong: 0 };
      setScreen("quiz");
    });
  }
  document.getElementById("back-home-btn").addEventListener("click", () => setScreen("home"));
}

function renderStats() {
  appEl.innerHTML = "";
  const tpl = document.getElementById("tpl-stats");
  appEl.appendChild(tpl.content.cloneNode(true));

  let totalCorrect = 0, totalWrong = 0, attempted = 0;
  KANJI_DATA.forEach(w => {
    const p = progress[w.id];
    if (p && (p.correct > 0 || p.wrong > 0)) {
      attempted += 1;
      totalCorrect += p.correct;
      totalWrong += p.wrong;
    }
  });
  const totalAnswers = totalCorrect + totalWrong;
  const accuracy = totalAnswers > 0 ? Math.round((totalCorrect / totalAnswers) * 100) : 0;

  document.getElementById("stats-overview").innerHTML = `
    <div class="stat-box"><span class="stat-value">${attempted}</span><span class="stat-label">学習した漢字</span></div>
    <div class="stat-box"><span class="stat-value">${accuracy}%</span><span class="stat-label">正答率</span></div>
    <div class="stat-box"><span class="stat-value">${totalAnswers}</span><span class="stat-label">総解答数</span></div>
  `;

  const weakList = document.getElementById("weak-list");
  const weakItems = KANJI_DATA
    .map(w => ({ word: w, p: progress[w.id] }))
    .filter(x => x.p && x.p.wrong > 0)
    .sort((a, b) => (b.p.wrong - b.p.correct) - (a.p.wrong - a.p.correct))
    .slice(0, 15);

  if (weakItems.length === 0) {
    weakList.innerHTML = `<li class="empty-note" style="display:block;text-align:center;">まだ苦手な漢字はありません。</li>`;
  } else {
    weakList.innerHTML = weakItems.map(x => `
      <li>
        <span><span class="weak-word">${x.word.word}</span><span class="weak-reading">${x.word.reading}</span></span>
        <span class="weak-score">○${x.p.correct} / ✕${x.p.wrong}</span>
      </li>
    `).join("");
  }

  document.getElementById("reset-progress-btn").addEventListener("click", () => {
    if (confirm("学習記録をすべてリセットします。よろしいですか？")) {
      progress = {};
      saveProgress(progress);
      renderStats();
    }
  });
}

render();
</script>
</body>
</html>
